# NyayaAI - local/server stack: MongoDB + ML service + API + frontend
#   cp .env.example .env   (set JWT_SECRET)
#   docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      ML_SERVICE_PORT: ${ML_SERVICE_PORT:-8000}
      ALLOWED_ORIGINS: http://backend:5000
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/nyaya_ai}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      KANOON_API_TOKEN: ${KANOON_API_TOKEN:-}
      KANOON_API_BASE_URL: ${KANOON_API_BASE_URL:-https://api.indiankanoon.org}
      KANOON_DEFAULT_QUERY: ${KANOON_DEFAULT_QUERY:-civil suit doctypes:judgments}
      KANOON_AUTO_SYNC_ON_STARTUP: ${KANOON_AUTO_SYNC_ON_STARTUP:-true}
      KANOON_AUTO_SYNC_LIMIT: ${KANOON_AUTO_SYNC_LIMIT:-60}
      KANOON_AUTO_SYNC_PREDICT: ${KANOON_AUTO_SYNC_PREDICT:-true}
      SAMPLE_CSV_PATH: /sample-data/sample_cases.csv
    volumes:
      - ./ml-service/data/sample:/sample-data:ro
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
